spring:
  datasource:
    url: jdbc:postgresql://${MECS_DB_HOST:localhost}:${MECS_DB_PORT:5432}/${MECS_DB_NAME:mecs_db}
    username: ${MECS_DB_USER}
    password: ${MECS_DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-init-sql: "SET timezone = 'Asia/Kolkata'"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: false
  # Flyway managed explicitly via FlywayConfig — auto-config disabled (broken in Spring Boot 4.x)
  flyway:
    enabled: false

server:
  port: 8080

mecs:
  jwt:
    secret: ${MECS_JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  cookie:
    secure: true
  cors:
    allowed-origin: ${MECS_CORS_ORIGIN:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
